services:
  - type: web
    name: nexio-ai-backend
    runtime: docker
    plan: free
    rootDir: backend
    # Paths are relative to rootDir; the start command lives in the Dockerfile CMD.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Nexio AI
      - key: LLM_PROVIDER_ORDER
        value: openai,anthropic,groq,groq_backup
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
